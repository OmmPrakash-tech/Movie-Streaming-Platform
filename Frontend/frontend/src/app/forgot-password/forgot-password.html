<div class="auth-page">

  <!-- Background Image + Overlay -->
  <div class="bg"></div>

  <!-- Logo -->
  <div class="logo">
    <mat-icon class="logo-icon">movie</mat-icon>
    <span class="logo-text">PulseScreen</span>
  </div>

  <!-- Card -->
  <mat-card class="auth-card" appearance="outlined">

    <h1>Forgot Password</h1>

    <p class="enter">
      Enter your email address and we'll send you a link to reset your password.
    </p>

    <form [formGroup]="forgotPassword" (ngSubmit)="submit()" class="form">

      <!-- Email Field -->
      <mat-form-field appearance="outline" class="field">
        <mat-label>Email Address</mat-label>

        <input matInput formControlName="email" />

        <mat-icon matPrefix>email</mat-icon>

        <mat-error *ngIf="forgotPassword.get('email')?.hasError('required')">
          Email is required
        </mat-error>

        <mat-error *ngIf="forgotPassword.get('email')?.hasError('email')">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <!-- Submit Button -->
      <button
        mat-flat-button
        class="submit-btn"
        type="submit"
        [disabled]="loading || !forgotPassword.valid"
      >
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      <!-- Back to Login -->
      <div class="back-to-login">
        <a routerLink="/login" class="link">Back to Sign In</a>
      </div>

    </form>

  </mat-card>

</div>
