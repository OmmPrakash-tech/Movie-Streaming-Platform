<div class="auth-page">
  <div class="bg"></div>

  <div class="logo">
    <mat-icon class="logo-icon">movie</mat-icon>
    <span class="logo-text">PulseScreen</span>
  </div>

  <mat-card class="auth-card" appearance="outlined">
    <h3>Sign In</h3>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="form">

      <!-- Email -->
      <mat-form-field appearance="outline" class="field">
        <mat-label>Email</mat-label>

        <input matInput formControlName="email" />

        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>

        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <!-- Password -->
      <mat-form-field appearance="outline" class="field">
        <mat-label>Password</mat-label>

        <input
          matInput
          [type]="hide ? 'password' : 'text'"
          formControlName="password"
        />

        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hide = !hide"
          [attr.aria-label]="hide ? 'Show password' : 'Hide password'"
          [attr.aria-pressed]="!hide"
          tabindex="-1"
        >
          <mat-icon>
            {{ hide ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>

        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>

        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          Password must be at least 6 characters
        </mat-error>
      </mat-form-field>

      <!-- Submit -->
      <button
        mat-flat-button
        class="sign-in-btn"
        type="submit"
        [disabled]="loading || loginForm.invalid"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

      <!-- Resend verification -->
      <button
        type="button"
        class="link-btn resend"
        *ngIf="showResendLink"
        (click)="resendVerification()"
      >
        Resend verification email
      </button>

      <!-- Forgot password -->
     <button
  type="button"
  class="link-btn forgot"
  routerLink="/forgot-password"
>
  Forgot Password?
</button>

      <!-- Signup -->
      <div class="signup">
        <span>New to PulseScreen?</span>
        <a routerLink="/signup" class="link">Sign up now.</a>
      </div>

    </form>
  </mat-card>
</div>
